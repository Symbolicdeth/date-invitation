<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quick Question</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="invitation-card">

        <div class="profile-picture">
            <img
                src="images/date-cat.jpg"
                alt="A cat, ready for a date"
            >
        </div>

        <span class="label">QUICK QUESTION</span>

        <h1>Would you go on a date with me?</h1>

        <p class="description">
            No pressure. Just good food and questionable jokes.
        </p>

        <div class="buttons">

            <button id="yesButton">
                YES, WHY NOT?
            </button>

            <button id="noButton">
                NO
            </button>

        </div>

        <p class="footer">
            An important decision requires at least 3 seconds.
        </p>

    </main>

    <script src="script.js"></script>

</body>
</html>
